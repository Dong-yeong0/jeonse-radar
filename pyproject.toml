[project]
name = "jeonse-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.12.7",
    "dbt-postgres==1.11.0",
]

[tool.uv]
default-groups = ["airflow"]

[dependency-groups]
airflow = [
    "apache-airflow==3.4.0",
    "apache-airflow-providers-common-sql==2.4.0",
    "apache-airflow-providers-postgres==7.1.1",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
src = [".", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
